pre-commit:
  parallel: false
  commands:
    lint-staged:
      run: pnpm exec lint-staged
    actionlint:
      glob: '.github/**/*.{yml,yaml}'
      run: mise exec -- actionlint
    zizmor:
      glob: '.github/**/*.{yml,yaml}'
      run: mise exec -- zizmor --offline --config .github/zizmor.yml .
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
