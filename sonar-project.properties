# ============================================
# Project Information
# ============================================
sonar.organization=rapaglaz
sonar.projectKey=rapaglaz_rapaglaz-portfolio
sonar.projectName=rapaglaz-portfolio
sonar.projectVersion=0.0.1

# ============================================
# Source Code Configuration
# ============================================
# apps/workers/ holds the Cloudflare Workers that enforce the CV download checks
sonar.sources=apps/rapaglaz-portfolio/src,libs,apps/workers
sonar.tests=apps/rapaglaz-portfolio/src,libs,apps/workers
sonar.test.inclusions=**/*.spec.ts

# Language-specific settings
sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js
sonar.typescript.file.suffixes=.ts

# ============================================
# Exclusions & Duplications
# ============================================
# Exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.md

# Exclude from coverage calculations; the Worker tests produce no lcov report
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.config.ts,\
  **/*.d.ts,\
  **/main.ts,\
  apps/workers/**

# Exclude from duplication detection
sonar.cpd.exclusions=\
  **/*.spec.ts

# ============================================
# Code Coverage
# ============================================
# One report per Vitest project; the JavaScript property covers TypeScript too
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# ============================================
# Code Quality Settings
# ============================================
# Cognitive Complexity threshold
sonar.typescript.cognitive.threshold=15

# Duplication detection (default: 10 lines for TS)
sonar.cpd.ts.minimumTokens=50

# Security: Enable security hotspot detection
sonar.security.hotspot.analysisMode=COMPREHENSIVE
