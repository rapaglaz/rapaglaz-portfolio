rules:
  # The `$/...` self-repository syntax is not documented by GitHub Actions, so
  # `./.github/actions/...` stays until it is verified to work on runners.
  self-repository:
    disable: true
  # FTP-Deploy-Action publishes both a tag and a branch named v4.4.0. The pin matches
  # the tag, zizmor resolves the comment to the branch. Matched by line number, so
  # update it when the deploy step moves.
  ref-version-mismatch:
    ignore:
      - main-branch-ci-cd.yaml:115
