name: Build
description: 'Builds the application.'

inputs:
  base-href:
    description: 'Base href for the application'
    required: false
    default: ''
  skip-nx-cache:
    description: "'true' builds without reading the Nx cache"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      uses: ./.github/actions/workspace-setup

    - name: Run build
      shell: bash
      env:
        BASE_HREF: ${{ inputs.base-href }}
        SKIP_NX_CACHE: ${{ inputs.skip-nx-cache }}
      run: |
        set --
        if [ -n "$BASE_HREF" ]; then
          set -- "$@" "--base-href=$BASE_HREF"
        fi
        if [ "$SKIP_NX_CACHE" = 'true' ]; then
          set -- "$@" --skip-nx-cache
        fi
        pnpm run build "$@"
