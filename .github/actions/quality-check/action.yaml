name: Quality Check
description: 'Runs format, lint, dependency boundaries, i18n, app and Worker tests, and uploads the coverage.'

inputs:
  mode:
    description: 'Which checks to run: lint | test | all'
    required: false
    default: 'all'
  coverage-artifact-name:
    description: 'Name for the uploaded coverage artifact'
    required: false
    default: 'coverage-reports'
  coverage-retention-days:
    description: 'Days to retain coverage artifact (0 = default/unlimited)'
    required: false
    default: '0'

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      uses: ./.github/actions/workspace-setup

    - name: Run format check
      if: ${{ inputs.mode == 'lint' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run format:check

    - name: Run lint
      if: ${{ inputs.mode == 'lint' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run lint

    - name: Run type check
      if: ${{ inputs.mode == 'lint' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run typecheck

    - name: Check dependency boundaries
      if: ${{ inputs.mode == 'lint' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run deps:check

    - name: Run i18n validation
      if: ${{ inputs.mode == 'test' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run i18n:check

    - name: Run tests with coverage
      if: ${{ inputs.mode == 'test' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run test:coverage

    - name: Run Worker tests
      if: ${{ inputs.mode == 'test' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run test:workers

    - name: Validate Worker configuration
      if: ${{ inputs.mode == 'test' || inputs.mode == 'all' }}
      shell: bash
      run: pnpm run workers:check

    - name: Upload coverage reports
      if: ${{ (inputs.mode == 'test' || inputs.mode == 'all') && always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: coverage/
        retention-days: ${{ inputs.coverage-retention-days != '0' && inputs.coverage-retention-days || '' }}
        if-no-files-found: ignore
