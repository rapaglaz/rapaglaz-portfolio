name: Format Lighthouse Results
description: 'Parses .lighthouseci output and exposes scores as outputs.'

outputs:
  performance:
    description: 'Performance score (0-100)'
    value: ${{ steps.parse.outputs.performance }}
  accessibility:
    description: 'Accessibility score (0-100)'
    value: ${{ steps.parse.outputs.accessibility }}
  best_practices:
    description: 'Best Practices score (0-100)'
    value: ${{ steps.parse.outputs.best_practices }}
  seo:
    description: 'SEO score (0-100)'
    value: ${{ steps.parse.outputs.seo }}
  average:
    description: 'Average score (0-100), rounded to 1 decimal place'
    value: ${{ steps.parse.outputs.average }}
  perf_status:
    description: 'Performance status emoji (✅ / ⚠️)'
    value: ${{ steps.parse.outputs.perf_status }}
  a11y_status:
    description: 'Accessibility status emoji (✅ / ⚠️)'
    value: ${{ steps.parse.outputs.a11y_status }}
  bp_status:
    description: 'Best Practices status emoji (✅ / ⚠️)'
    value: ${{ steps.parse.outputs.bp_status }}
  seo_status:
    description: 'SEO status emoji (✅ / ⚠️)'
    value: ${{ steps.parse.outputs.seo_status }}
  a11y_pass:
    description: 'Accessibility pass/fail label (✅ PASS / ⚠️ BELOW THRESHOLD)'
    value: ${{ steps.parse.outputs.a11y_pass }}

runs:
  using: 'composite'
  steps:
    - name: Parse Lighthouse report
      id: parse
      shell: bash
      run: |
        latest_report=".lighthouseci/lhr.json"

        if [ ! -f "$latest_report" ]; then
          echo "Error: No LHR report found at $latest_report" && exit 1
        fi

        # A category score can come back null when Lighthouse fails to produce
        # a value for a required audit (e.g. a flaky run) - fall back to "N/A"
        # instead of crashing the step, since these assertions are warn-only.
        round_score() { jq -r "(.categories.$1.score // empty) * 100 | round" "$latest_report" 2>/dev/null || echo "N/A"; }
        raw_score() { jq -r ".categories.$1.score // 0" "$latest_report"; }

        perf=$(round_score performance); [ -z "$perf" ] && perf="N/A"
        a11y=$(round_score accessibility); [ -z "$a11y" ] && a11y="N/A"
        bp=$(round_score '"best-practices"'); [ -z "$bp" ] && bp="N/A"
        seo=$(round_score seo); [ -z "$seo" ] && seo="N/A"

        # Raw scores for the average - missing categories count as 0
        perf_raw=$(raw_score performance)
        a11y_raw=$(raw_score accessibility)
        bp_raw=$(raw_score '"best-practices"')
        seo_raw=$(raw_score seo)

        # Calculate average and round to 1 decimal place
        avg=$(echo "(($perf_raw + $a11y_raw + $bp_raw + $seo_raw) / 4) * 100" | bc -l | LC_ALL=C awk '{printf "%.1f", $1}')

        get_status() {
          [ "$1" = "N/A" ] && { echo "⚠️"; return; }
          [ "$1" -ge "$2" ] && echo "✅" || echo "⚠️"
        }

        {
          echo "performance=$perf"
          echo "accessibility=$a11y"
          echo "best_practices=$bp"
          echo "seo=$seo"
          echo "average=$avg"
          echo "perf_status=$(get_status "$perf" 90)"
          echo "a11y_status=$(get_status "$a11y" 95)"
          echo "bp_status=$(get_status "$bp" 95)"
          echo "seo_status=$(get_status "$seo" 95)"
          echo "a11y_pass=$([ "$a11y" != "N/A" ] && [ "$a11y" -ge 95 ] && echo '✅ PASS' || echo '⚠️ BELOW THRESHOLD')"
        } >> "$GITHUB_OUTPUT"
