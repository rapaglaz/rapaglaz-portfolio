name: Lighthouse Report
description: 'Runs Lighthouse against the local preview server and posts results as a PR comment.'

inputs:
  github-token:
    description: 'GitHub token for posting the PR comment'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Start preview server
      shell: bash
      run: nohup pnpm run preview > preview-server.log 2>&1 &

    - name: Wait for preview server
      shell: bash
      run: |
        for _ in $(seq 1 30); do
          if curl -sf http://localhost:4233 > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "Preview server did not start in time" >&2
        cat preview-server.log
        exit 1

    - name: Run Lighthouse
      shell: bash
      run: |
        mkdir -p .lighthouseci
        for i in 1 2 3; do
          pnpm exec lighthouse http://localhost:4233 \
            --output=json --output=html \
            --output-path=".lighthouseci/run-$i" \
            --chrome-flags="--headless --no-sandbox" \
            --preset=desktop \
            --throttling-method=devtools \
            --only-categories=performance,accessibility,best-practices,seo \
            --quiet
        done

        # Take the run whose performance score is the median of the 3 - a
        # bare localhost server has near-zero network latency, and even
        # with devtools throttling a single run occasionally still misses
        # an LCP candidate (see .github/actions/lighthouse/format for the
        # null-score fallback). The median guards against picking that
        # outlier run.
        s1=$(jq -r '.categories.performance.score // 0' .lighthouseci/run-1.report.json)
        s2=$(jq -r '.categories.performance.score // 0' .lighthouseci/run-2.report.json)
        s3=$(jq -r '.categories.performance.score // 0' .lighthouseci/run-3.report.json)
        median_run=$(printf '%s 1\n%s 2\n%s 3\n' "$s1" "$s2" "$s3" | sort -n -k1,1 | awk 'NR==2{print $2}')

        cp ".lighthouseci/run-${median_run}.report.json" .lighthouseci/lhr.json
        cp ".lighthouseci/run-${median_run}.report.html" .lighthouseci/lhr.html

    - name: Upload Lighthouse HTML report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lighthouse-report
        path: .lighthouseci/lhr.html
        retention-days: 7

    - name: Format Lighthouse results
      id: format
      uses: ./.github/actions/lighthouse/format

    - name: Comment PR with results
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: lighthouse
        GITHUB_TOKEN: ${{ inputs.github-token }}
        message: |
          ## Lighthouse CI Results

          ### Accessibility Score

          | Score | Status | Threshold |
          |:-----:|:------:|:---------:|
          | **${{ steps.format.outputs.average }}%** | ${{ steps.format.outputs.a11y_pass }} | ≥ 95% |

          ### All Categories

          | Category | Score | Status |
          |----------|:-----:|:------:|
          | Performance | **${{ steps.format.outputs.performance }}%** | ${{ steps.format.outputs.perf_status }} |
          | Accessibility | **${{ steps.format.outputs.accessibility }}%** | ${{ steps.format.outputs.a11y_status }} |
          | Best Practices | **${{ steps.format.outputs.best_practices }}%** | ${{ steps.format.outputs.bp_status }} |
          | SEO | **${{ steps.format.outputs.seo }}%** | ${{ steps.format.outputs.seo_status }} |

          > **Thresholds:** Performance ≥95%, Accessibility ≥95%, Best Practices ≥95%, SEO ≥95%

          Full report available in this run's workflow artifacts (`lighthouse-report`).
