name: E2E Tests
description: 'Runs Playwright E2E tests on the runner through Nx; each ci-* configuration installs its browser.'

inputs:
  configuration:
    description: 'Nx configuration of the e2e target: ci-chromium or ci-webkit, one browser project each.'
    required: true
  build-artifact-name:
    description: 'Name of a pre-built dist artifact to download. When empty, builds the application from scratch.'
    required: false
    default: ''
  report-artifact-name:
    description: 'Name for the uploaded Playwright report artifact (only uploaded on failure).'
    required: true
  report-retention-days:
    description: 'Days to retain the Playwright report artifact.'
    required: false
    default: '3'

runs:
  using: composite
  steps:
    - name: Download build artifact
      if: ${{ inputs.build-artifact-name != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.build-artifact-name }}
        path: dist/apps/rapaglaz-portfolio/browser

    - name: Setup environment
      if: ${{ inputs.build-artifact-name != '' }}
      uses: ./.github/actions/workspace-setup

    - name: Build application
      if: ${{ inputs.build-artifact-name == '' }}
      uses: ./.github/actions/build

    # The ci-* configurations install their browser and its system dependencies inside the
    # Nx task, so a remote cache hit skips both the install and the tests.
    - name: Run Playwright tests
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
      run: pnpm exec nx e2e rapaglaz-portfolio-e2e "--configuration=$CONFIGURATION"

    # Retries on CI turn a test that fails and then passes into a green job; list those tests.
    # Only reports, never fails the job.
    - name: Report flaky tests
      if: always()
      continue-on-error: true
      shell: bash
      env:
        # written by the json reporter in playwright.config.mts
        REPORT_FILE: dist/.playwright/apps/rapaglaz-portfolio-e2e/test-output/results.json
      run: |
        {
          echo '### Flaky E2E tests'
          echo
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No Playwright JSON report at \`$REPORT_FILE\`."
          elif ! flaky=$(jq -er '.stats.flaky' "$REPORT_FILE"); then
            echo "Cannot read \`stats.flaky\` from \`$REPORT_FILE\`."
          else
            echo "Flaky: $flaky"
            jq -r '
              def flaky($path):
                ((.specs // [])[] | . as $spec | .tests[] | select(.status == "flaky")
                  | "- \(($path + [$spec.title]) | join(" › ")) (\(.projectName))"),
                ((.suites // [])[] | flaky($path + [.title]));
              .suites[] | flaky([.title])
            ' "$REPORT_FILE"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Check Playwright report
      if: failure()
      id: check-report
      shell: bash
      env:
        # nxE2EPreset writes the HTML report under dist/.playwright/<project root>
        REPORT_DIR: dist/.playwright/apps/rapaglaz-portfolio-e2e/playwright-report
      run: |
        if [ -d "$REPORT_DIR" ] && [ -n "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Playwright report
      if: failure() && steps.check-report.outputs.exists == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-artifact-name }}
        path: dist/.playwright/apps/rapaglaz-portfolio-e2e/playwright-report/
        retention-days: ${{ inputs.report-retention-days }}
