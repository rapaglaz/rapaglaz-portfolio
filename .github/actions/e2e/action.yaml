name: E2E Tests
description: 'Runs Playwright E2E tests on the runner through Nx; the ci configuration installs the browsers.'

inputs:
  build-artifact-name:
    description: 'Name of a pre-built dist artifact to download. When empty, builds the application from scratch.'
    required: false
    default: ''
  report-artifact-name:
    description: 'Name for the uploaded Playwright report artifact (only uploaded on failure).'
    required: true
  report-retention-days:
    description: 'Days to retain the Playwright report artifact.'
    required: false
    default: '3'

runs:
  using: composite
  steps:
    - name: Download build artifact
      if: ${{ inputs.build-artifact-name != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.build-artifact-name }}
        path: dist/apps/rapaglaz-portfolio/browser

    - name: Setup environment
      if: ${{ inputs.build-artifact-name != '' }}
      uses: ./.github/actions/workspace-setup

    - name: Build application
      if: ${{ inputs.build-artifact-name == '' }}
      uses: ./.github/actions/build

    # The ci configuration installs the browsers and their system dependencies inside the
    # Nx task, so a remote cache hit skips both the install and the tests.
    - name: Run Playwright tests
      shell: bash
      run: pnpm exec nx e2e rapaglaz-portfolio-e2e --configuration=ci

    - name: Check Playwright report
      if: failure()
      id: check-report
      shell: bash
      env:
        # nxE2EPreset writes the HTML report under dist/.playwright/<project root>
        REPORT_DIR: dist/.playwright/apps/rapaglaz-portfolio-e2e/playwright-report
      run: |
        if [ -d "$REPORT_DIR" ] && [ -n "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Playwright report
      if: failure() && steps.check-report.outputs.exists == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-artifact-name }}
        path: dist/.playwright/apps/rapaglaz-portfolio-e2e/playwright-report/
        retention-days: ${{ inputs.report-retention-days }}
