name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_PR_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Run Lint
        uses: ./.github/actions/quality-check
        with:
          mode: lint

      # actionlint and zizmor in the versions from mise.toml, with the commands of the pre-commit
      # hook; they run even when the lint step failed, so one run shows every finding
      - name: Install actionlint and zizmor
        if: ${{ !cancelled() }}
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Run actionlint
        if: ${{ !cancelled() }}
        run: actionlint

      - name: Run zizmor
        if: ${{ !cancelled() }}
        env:
          # the online audits read the pinned actions through the GitHub API
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github --config .github/zizmor.yml .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_PR_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Run Tests
        uses: ./.github/actions/quality-check
        with:
          mode: test
          coverage-artifact-name: coverage-reports
          coverage-retention-days: '3'

  # Not in the quality-check gate: nobody waits for the Sonar quality gate
  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      # secrets cannot be used in a step condition; this passes only whether the token is set
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          # Sonar reads the history for blame and new code
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: coverage

      - name: SonarCloud Scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.newCode.referenceBranch=main

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_PR_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Build application
        uses: ./.github/actions/build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifact-pr
          path: dist/apps/rapaglaz-portfolio/browser
          retention-days: 1

  e2e-tests:
    needs: [build]
    strategy:
      # a failure in one browser does not cancel the other, so one run shows both results
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_PR_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Run E2E tests
        uses: ./.github/actions/e2e
        with:
          configuration: ci-${{ matrix.browser }}
          build-artifact-name: build-artifact-pr
          report-artifact-name: playwright-report-pr-${{ matrix.browser }}
          report-retention-days: 3

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact-pr
          path: dist/apps/rapaglaz-portfolio/browser

      - name: Setup environment
        uses: ./.github/actions/workspace-setup

      - name: Run Lighthouse report
        uses: ./.github/actions/lighthouse/report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  quality-check:
    needs: [lint, test, build, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job did not succeed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "E2E tests job did not succeed"
            exit 1
          fi
