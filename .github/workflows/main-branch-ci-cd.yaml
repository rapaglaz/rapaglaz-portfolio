name: Main Branch CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run Lint
        uses: ./.github/actions/quality-check
        with:
          mode: lint
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Tests
        uses: ./.github/actions/quality-check
        with:
          mode: test
          coverage-artifact-name: coverage-reports-main
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-extra-args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.branch.name=main

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build application
        uses: ./.github/actions/build
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifact-main
          path: dist/apps/rapaglaz-portfolio/browser
          retention-days: 1

  e2e-tests:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run E2E tests
        uses: ./.github/actions/e2e
        with:
          build-artifact-name: build-artifact-main
          report-artifact-name: playwright-report-main
          report-retention-days: 7

  deploy:
    needs: [lint, test, build, e2e-tests]
    if: >-
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact-main
          path: ./dist/apps/rapaglaz-portfolio/browser

      - name: Deploy (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          protocol: ftps
          server-dir: /
          local-dir: ./dist/apps/rapaglaz-portfolio/browser/

  deploy-workers:
    needs: [lint, test]
    # Opt-in: set the repository variable DEPLOY_WORKERS to true once every wrangler.jsonc
    # carries the bindings from the dashboard, otherwise a deploy would drop them.
    if: >-
      !cancelled() &&
      vars.DEPLOY_WORKERS == 'true' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gh run list reads the last green main run
      actions: read
    strategy:
      fail-fast: false
      matrix:
        worker: [feature-flag, portfolio-settings, cv-download]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for changes in this Worker
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER: ${{ matrix.worker }}
        run: |
          # Compare with the last green main run, not the previous push: a run that was cancelled
          # by a newer push or failed never deployed its Worker changes.
          BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main-branch-ci-cd.yaml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty') || BASE=''
          # without a known base every Worker deploys
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null ||
            ! git diff --quiet "$BASE" HEAD -- "workers/$WORKER" workers/package.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ matrix.worker }}
        run: npx --yes wrangler@4.151.1 deploy --config "workers/$WORKER/wrangler.jsonc"
