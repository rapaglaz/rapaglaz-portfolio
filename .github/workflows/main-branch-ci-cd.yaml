name: Main Branch CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Run Lint
        uses: ./.github/actions/quality-check
        with:
          mode: lint
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Run Tests
        uses: ./.github/actions/quality-check
        with:
          mode: test
          coverage-artifact-name: coverage-reports-main
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-extra-args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.branch.name=main

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Build application
        uses: ./.github/actions/build
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifact-main
          path: dist/apps/rapaglaz-portfolio/browser
          retention-days: 1

  e2e-tests:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run E2E tests
        uses: ./.github/actions/e2e
        with:
          build-artifact-name: build-artifact-main
          report-artifact-name: playwright-report-main
          report-retention-days: 7

  deploy:
    needs: [lint, test, build, e2e-tests]
    if: >-
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact-main
          path: ./dist/apps/rapaglaz-portfolio/browser

      - name: Deploy (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          protocol: ftps
          server-dir: /
          local-dir: ./dist/apps/rapaglaz-portfolio/browser/

  deploy-workers:
    needs: [lint, test]
    # Kill switch: set the repository variable DEPLOY_WORKERS to anything but true to stop Worker
    # deploys without a commit, e.g. during an incident or while the dashboard config is changed.
    if: >-
      !cancelled() &&
      vars.DEPLOY_WORKERS == 'true' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gh run list reads the last green main run
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Setup environment
        uses: ./.github/actions/workspace-setup

      - name: Find affected Workers
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare with the last green main run, not the previous push: a run that was cancelled
          # by a newer push or failed never deployed its Worker changes.
          BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main-branch-ci-cd.yaml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty') || BASE=''
          # without a known base every Worker deploys
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            WORKERS=$(pnpm nx show projects --affected --base="$BASE" --head=HEAD -t deploy --json | jq -r 'join(",")')
          else
            WORKERS=$(pnpm nx show projects -t deploy --json | jq -r 'join(",")')
          fi
          echo "Workers to deploy: ${WORKERS:-none}"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"

      - name: Test and bundle Workers
        if: steps.affected.outputs.workers != ''
        env:
          WORKERS: ${{ steps.affected.outputs.workers }}
        run: pnpm nx run-many -t test,check -p "$WORKERS"

      # Nx continues with the other Workers when one deploy fails and reports the failure at the end
      - name: Deploy Workers
        if: steps.affected.outputs.workers != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS: ${{ steps.affected.outputs.workers }}
        run: pnpm nx run-many -t deploy -p "$WORKERS" --excludeTaskDependencies
