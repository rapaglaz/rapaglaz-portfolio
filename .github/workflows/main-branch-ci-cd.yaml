name: Main Branch CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# Runs queue, so a newer push cannot cancel a running deploy. GitHub keeps only the newest pending
# run, so a burst of pushes still ends in one run of the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Run Lint
        uses: ./.github/actions/quality-check
        with:
          mode: lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Run Tests
        uses: ./.github/actions/quality-check
        with:
          mode: test
          coverage-artifact-name: coverage-reports-main

  # Not in the needs of the deploy: nobody waits for the Sonar quality gate
  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # secrets cannot be used in a step condition; this passes only whether the token is set
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar reads the history for blame and new code
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports-main
          path: coverage

      - name: SonarCloud Scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.branch.name=main

  # Not in the needs of the deploy. Direct pushes to main skip the pull request checks, so the
  # workflows are linted here too, with the versions from mise.toml.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install actionlint and zizmor
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Run actionlint
        run: actionlint

      - name: Run zizmor
        env:
          # the online audits read the pinned actions through the GitHub API
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github --config .github/zizmor.yml .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      # main builds the artifact it deploys itself; a cache hit could replay a pull request build
      - name: Build application
        uses: ./.github/actions/build
        with:
          skip-nx-cache: 'true'

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifact-main
          path: dist/apps/rapaglaz-portfolio/browser
          retention-days: 1

  e2e-tests:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Run E2E tests
        uses: ./.github/actions/e2e
        with:
          build-artifact-name: build-artifact-main
          report-artifact-name: playwright-report-main
          report-retention-days: 7
          # the deployed artifact is tested in this run, never replayed from the cache
          skip-nx-cache: 'true'

  deploy:
    needs: [lint, test, build, e2e-tests]
    # workflow_dispatch can run this workflow on any branch, but only main deploys
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact-main
          path: ./dist/apps/rapaglaz-portfolio/browser

      - name: Deploy (FTP)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          protocol: ftps
          server-dir: /
          local-dir: ./dist/apps/rapaglaz-portfolio/browser/

  deploy-workers:
    needs: [lint, test, build, e2e-tests]
    # Kill switch: set the repository variable DEPLOY_WORKERS to anything but true to stop Worker
    # deploys without a commit, e.g. during an incident or while the dashboard config is changed.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_WORKERS == 'true' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gh run list reads the last green main run
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Connect Nx remote cache
        uses: ./.github/actions/nx-remote-cache
        with:
          server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
          access-token: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
          ts-oauth-client-id: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.NX_SELF_HOSTED_TS_OAUTH_SECRET }}

      - name: Setup environment
        uses: ./.github/actions/workspace-setup

      - name: Find affected Workers
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare with the last green main run, not the previous push: a run that was cancelled
          # by a newer push or failed never deployed its Worker changes.
          BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main-branch-ci-cd.yaml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty') || BASE=''
          # without a known base every Worker deploys
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            WORKERS=$(pnpm nx show projects --affected --base="$BASE" --head=HEAD -t deploy --json | jq -r 'join(",")')
          else
            WORKERS=$(pnpm nx show projects -t deploy --json | jq -r 'join(",")')
          fi
          echo "Workers to deploy: ${WORKERS:-none}"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"

      - name: Test and bundle Workers
        if: steps.affected.outputs.workers != ''
        env:
          WORKERS: ${{ steps.affected.outputs.workers }}
        run: pnpm nx run-many -t test,check -p "$WORKERS"

      # Nx continues with the other Workers when one deploy fails and reports the failure at the end
      - name: Deploy Workers
        if: steps.affected.outputs.workers != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS: ${{ steps.affected.outputs.workers }}
        run: pnpm nx run-many -t deploy -p "$WORKERS" --excludeTaskDependencies

  # Checks the live site and the Workers after the deploy. It cannot undo a deploy, but a red run
  # shows that the Cloudflare rules in the dashboard or a Worker no longer match the docs.
  smoke:
    needs: [deploy, deploy-workers]
    if: >-
      !cancelled() &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact-main
          path: dist/apps/rapaglaz-portfolio/browser

      - name: Check the site
        env:
          # the live pages must load the main bundle of the artifact that was deployed
          EXPECTED_DIR: dist/apps/rapaglaz-portfolio/browser
        run: sh scripts/site-smoke.sh

      # runs even when the site check failed, so one run shows every problem
      - name: Check the Workers
        if: ${{ !cancelled() }}
        run: bash apps/workers/scripts/workers-smoke.sh
