  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();

    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)

      throw new TypeError("Widget state must be a JSON object");

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||

          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },

      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)

      throw new TypeError("Widget state must be a JSON object");

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

      hasOwn(storedState, "imageIds") &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== "string",

      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length &gt; 0) {

        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {

        pendingStateWrites.delete(id);
        reject(persistenceError());

      postToHost("widget-state-write", { id, state: serializedState });

  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" &amp;&amp; data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &amp;&amp;
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

  #hero-background-options {
    padding-top: 52px;
  }
  #hero-background-options .portfolio-preview {
    --portfolio-surface: light-dark(#ffffff, #0a0f1e);
    --portfolio-primary: light-dark(#4e696b, #86e3eb);
    --portfolio-secondary: light-dark(#8ebcc0, #8ebcc0);
    --portfolio-text: light-dark(#143033, #f9fafb);
    --portfolio-muted: light-dark(#4a6366, #a8b5b7);
    --portfolio-outline: light-dark(#4e696b, #59a2ad);
    position: relative;
    isolation: isolate;
    box-sizing: border-box;
    overflow: hidden;
    height: 590px;
    background: var(--portfolio-surface);
    color: var(--portfolio-text);
    font-family: PortfolioInter, Inter, system-ui, sans-serif;
    border-radius: 16px;
  }
  #hero-background-options .portfolio-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 28px 32px;
    text-align: center;
  }
  #hero-background-options .portfolio-portrait {
    display: block;
    width: 144px;
    height: 144px;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    box-shadow:
      0 0 0 7px var(--portfolio-surface),
      0 0 0 10px color-mix(in srgb, var(--portfolio-primary) 50%, transparent),
      0 18px 42px light-dark(#14303322, #00000066);
  }
  #hero-background-options .portfolio-name {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 42px 0 0;
    color: transparent;
    -webkit-text-stroke: 1px var(--portfolio-outline);
    font-family: PortfolioManrope, Manrope, system-ui, sans-serif;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: 0.045em;
    line-height: 1.13;
  }
  #hero-background-options .portfolio-description {
    max-width: 510px;
    margin: 25px 0 0;
    color: var(--portfolio-muted);
    font-size: 15px;
    line-height: 1.65;
  }
  #hero-background-options .portfolio-decoration {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: var(--decoration-strength, 1);
  }
  #hero-background-options .terrain-cluster {
    position: absolute;
    width: 330px;
    height: 390px;
    color: var(--portfolio-primary);
    opacity: 0.42;
  }
  #hero-background-options .terrain-cluster-left {
    top: 34px;
    left: -205px;
    transform: rotate(-25deg);
  }
  #hero-background-options .terrain-cluster-right {
    right: -196px;
    bottom: -30px;
    transform: rotate(35deg);
  }
  #hero-background-options .terrain-cluster span {
    position: absolute;
    inset: var(--band-inset);
    border: 1px solid currentColor;
    border-radius: 45% 55% 59% 41% / 56% 40% 60% 44%;
    transform: rotate(var(--band-rotation));
  }
  #hero-background-options .terrain-cluster span:nth-child(1) {
    --band-inset: 0px;
    --band-rotation: 0deg;
  }
  #hero-background-options .terrain-cluster span:nth-child(2) {
    --band-inset: 18px;
    --band-rotation: 3deg;
  }
  #hero-background-options .terrain-cluster span:nth-child(3) {
    --band-inset: 37px;
    --band-rotation: 6deg;
  }
  #hero-background-options .terrain-cluster span:nth-child(4) {
    --band-inset: 57px;
    --band-rotation: 9deg;
  }
  #hero-background-options .terrain-cluster span:nth-child(5) {
    --band-inset: 78px;
    --band-rotation: 12deg;
  }
  #hero-background-options .terrain-cluster span:nth-child(6) {
    --band-inset: 100px;
    --band-rotation: 15deg;
  }
  #hero-background-options .ocean-glow {
    position: absolute;
    width: 530px;
    height: 420px;
    background: radial-gradient(
      ellipse,
      color-mix(in srgb, var(--portfolio-secondary) 34%, transparent) 0%,
      color-mix(in srgb, var(--portfolio-primary) 13%, transparent) 30%,
      transparent 68%
    );
  }
  #hero-background-options .ocean-glow-first {
    top: -108px;
    left: -210px;
    transform: rotate(-15deg);
  }
  #hero-background-options .ocean-glow-second {
    bottom: -120px;
    right: -210px;
    transform: rotate(20deg);
  }
  #hero-background-options .orbital-ring {
    position: absolute;
    left: 50%;
    top: 118px;
    width: var(--orbit-size);
    height: var(--orbit-size);
    border: 1px solid var(--portfolio-primary);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.26;
    mask-image: conic-gradient(
      transparent 0deg 24deg,
      black 66deg 132deg,
      transparent 162deg 213deg,
      black 256deg 304deg,
      transparent 338deg
    );
  }
  #hero-background-options .orbital-ring:nth-child(1) {
    --orbit-size: 360px;
  }
  #hero-background-options .orbital-ring:nth-child(2) {
    --orbit-size: 470px;
  }
  #hero-background-options .orbital-ring:nth-child(3) {
    --orbit-size: 580px;
  }
  #hero-background-options .dot-field {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(
      circle,
      color-mix(in srgb, var(--portfolio-primary) 54%, transparent) 1px,
      transparent 1.3px
    );
    background-size: 21px 21px;
    mask-image: linear-gradient(to right, black, transparent 29%, transparent 71%, black);
    opacity: 0.68;
  }
  #hero-background-options .network-node {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--portfolio-primary);
    opacity: 0.55;
  }
  #hero-background-options .network-line {
    position: absolute;
    height: 1px;
    background: var(--portfolio-primary);
    transform-origin: left center;
    opacity: 0.24;
  }
  #hero-background-options .network-line-left {
    left: 12px;
    top: 193px;
    width: 82px;
    transform: rotate(-32deg);
  }
  #hero-background-options .network-line-right {
    right: 7px;
    bottom: 126px;
    width: 91px;
    transform: rotate(29deg);
  }
  #hero-background-options .component-grid,
  #hero-background-options .route-grid,
  #hero-background-options .constellation-grid,
  #hero-background-options .code-grid {
    mask-image: linear-gradient(
      to right,
      black,
      black 12%,
      transparent 34%,
      transparent 66%,
      black 88%,
      black
    );
  }
  #hero-background-options .component-grid .dot-field,
  #hero-background-options .route-grid .dot-field,
  #hero-background-options .constellation-grid .dot-field,
  #hero-background-options .code-grid .dot-field {
    mask-image: none;
    opacity: 0.5;
  }
  #hero-background-options .component-cluster {
    position: absolute;
    width: 168px;
    height: 252px;
    color: var(--portfolio-primary);
  }
  #hero-background-options .component-cluster-left {
    left: -11px;
    top: 92px;
  }
  #hero-background-options .component-cluster-right {
    right: -11px;
    bottom: 42px;
    transform: rotate(180deg);
  }
  #hero-background-options .component-module {
    position: absolute;
    box-sizing: border-box;
    border: 1px solid currentColor;
    border-radius: 6px;
    background: color-mix(in srgb, var(--portfolio-primary) 3%, transparent);
    opacity: 0.38;
  }
  #hero-background-options .component-module::before,
  #hero-background-options .component-module::after {
    content: &#x27;&#x27;;
    position: absolute;
    width: 5px;
    height: 5px;
    background: currentColor;
    border: 3px solid var(--portfolio-surface);
    box-sizing: content-box;
    border-radius: 50%;
  }
  #hero-background-options .component-module::before {
    left: -6px;
    top: -6px;
  }
  #hero-background-options .component-module::after {
    right: -6px;
    bottom: -6px;
  }
  #hero-background-options .component-module:nth-child(1) {
    left: 0;
    top: 0;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;hero-background-options&#x27;);
    const heroContent = root.querySelector(&#x27;.portfolio-content&#x27;);
    root.querySelectorAll(&#x27;[data-shared-hero]&#x27;).forEach(element =&gt; {
      element.replaceWith(heroContent.cloneNode(true));
    });

    const codeTextureSources = Object.fromEntries(
      Array.from(root.querySelectorAll(&#x27;template[data-code-texture-source]&#x27;)).map(template =&gt; [
        template.dataset.codeTextureSource,
        template.content.querySelector(&#x27;pre&#x27;).textContent.trim(),
      ]),
    );
    root.querySelectorAll(&#x27;[data-code-fragment]&#x27;).forEach(element =&gt; {
      element.textContent = codeTextureSources[element.dataset.codeFragment];
    });

    const points = [
      [12, 42],
      [50, 12],
      [126, 54],
      [84, 126],
      [21, 189],
      [147, 210],
    ];
    const connections = [
      [0, 1],
      [1, 2],
      [0, 3],
      [2, 3],
      [3, 4],
      [3, 5],
      [4, 5],
    ];
    root.querySelectorAll(&#x27;[data-constellation]&#x27;).forEach(cluster =&gt; {
      connections.forEach(([start, end]) =&gt; {
        const [x, y] = points[start];
        const [targetX, targetY] = points[end];
        const edge = document.createElement(&#x27;span&#x27;);
        edge.className = &#x27;constellation-edge&#x27;;
        edge.style.left = `${x}px`;
        edge.style.top = `${y}px`;
        edge.style.width = `${Math.hypot(targetX - x, targetY - y)}px`;
        edge.style.transform = `rotate(${Math.atan2(targetY - y, targetX - x)}rad)`;
        cluster.append(edge);
      });
      points.forEach(([x, y], index) =&gt; {
        const dot = document.createElement(&#x27;span&#x27;);
        dot.className = index === 3 ? &#x27;constellation-dot is-hub&#x27; : &#x27;constellation-dot&#x27;;
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;
        dot.style.setProperty(&#x27;--point-size&#x27;, index === 3 ? &#x27;8px&#x27; : &#x27;5px&#x27;);
        cluster.append(dot);
      });
    });

    root.querySelectorAll(&#x27;[data-ripple]&#x27;).forEach(field =&gt; {
      for (let column = 0; column &lt;= 40; column++) {
        for (let row = 0; row &lt; 7; row++) {
          const dot = document.createElement(&#x27;span&#x27;);
          const progress = column / 40;
          const depth = row / 6;
          const wave = Math.sin(progress * Math.PI * 2.1 + depth * 0.6);
          dot.className = &#x27;ripple-dot&#x27;;
          dot.style.left = `${progress * 100}%`;
          dot.style.top = `${20 + row * 10 + wave * 12}%`;
          dot.style.opacity = `${0.12 + (1 - Math.abs(depth - 0.5) * 2) * 0.48}`;
          dot.style.setProperty(&#x27;--point-size&#x27;, `${1.5 + (1 - depth) * 0.8}px`);
          field.append(dot);
        }
      }
    });

    const pixelRows = {
      opening: [[5], [4], [3], [2], [3], [4], [5]],
      closing: [
        [5, 8],
        [5, 9],
        [4, 10],
        [4, 11],
        [3, 10],
        [3, 9],
        [2, 8],
      ],
    };
    root.querySelectorAll(&#x27;[data-code-symbol]&#x27;).forEach(cluster =&gt; {
      pixelRows[cluster.dataset.codeSymbol].forEach((columns, row) =&gt; {
        columns.forEach(column =&gt; {
          const dot = document.createElement(&#x27;span&#x27;);
          dot.className = &#x27;code-dot&#x27;;
          dot.style.gridColumn = column + 1;
          dot.style.gridRow = row + 1;
          cluster.append(dot);
        });
      });
    });
    const treePoints = [
      [14, 20],
      [77, 20],
      [77, 83],
      [140, 83],
      [77, 146],
      [140, 146],
      [14, 209],
      [77, 209],
    ];
    const treeSegments = [
      [14, 20, 77, 20],
      [77, 20, 77, 146],
      [77, 83, 140, 83],
      [77, 146, 140, 146],
      [14, 20, 14, 209],
      [14, 209, 77, 209],
    ];
    root.querySelectorAll(&#x27;[data-component-tree]&#x27;).forEach(tree =&gt; {
      treeSegments.forEach(([x, y, targetX, targetY]) =&gt; {
        const segment = document.createElement(&#x27;span&#x27;);
        segment.className = &#x27;tree-segment&#x27;;
        segment.style.left = `${Math.min(x, targetX)}px`;
        segment.style.top = `${Math.min(y, targetY)}px`;
        segment.style.width = `${Math.max(1, Math.abs(targetX - x))}px`;
        segment.style.height = `${Math.max(1, Math.abs(targetY - y))}px`;
        tree.append(segment);
      });
      treePoints.forEach(([x, y], index) =&gt; {
        const node = document.createElement(&#x27;span&#x27;);
        node.className = index === 0 ? &#x27;tree-node is-root&#x27; : &#x27;tree-node&#x27;;
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        tree.append(node);
      });
    });

    const controlPoints = [
      [10, 216],
      [160, 216],
      [-6, 20],
      [140, 20],
    ];
    root.querySelectorAll(&#x27;[data-bezier]&#x27;).forEach(cluster =&gt; {
      for (let curve = 0; curve &lt; 3; curve++) {
        for (let sample = 0; sample &lt;= 45; sample++) {
          const t = sample / 45;
          const weights = [(1 - t) ** 3, 3 * (1 - t) ** 2 * t, 3 * (1 - t) * t ** 2, t ** 3];
          const x = controlPoints.reduce((sum, point, index) =&gt; sum + weights[index] * point[0], 0);
          const y = controlPoints.reduce((sum, point, index) =&gt; sum + weights[index] * point[1], 0);
          const point = document.createElement(&#x27;span&#x27;);
          point.className = &#x27;bezier-point&#x27;;
          point.style.left = `${x + curve * 14}px`;
          point.style.top = `${y}px`;
          point.style.opacity = `${0.65 - curve * 0.15}`;
          cluster.append(point);
        }
      }
      [
        [0, 1],
        [2, 3],
      ].forEach(([start, end]) =&gt; {
        const [x, y] = controlPoints[start];
        const [targetX, targetY] = controlPoints[end];
        const guide = document.createElement(&#x27;span&#x27;);
        guide.className = &#x27;bezier-guide&#x27;;
        guide.style.left = `${x}px`;
        guide.style.top = `${y}px`;
        guide.style.width = `${Math.hypot(targetX - x, targetY - y)}px`;
        guide.style.transform = `rotate(${Math.atan2(targetY - y, targetX - x)}rad)`;
        cluster.append(guide);
      });
      controlPoints.forEach(([x, y]) =&gt; {
        const handle = document.createElement(&#x27;span&#x27;);
        handle.className = &#x27;bezier-handle&#x27;;
        handle.style.left = `${x}px`;
        handle.style.top = `${y}px`;
        cluster.append(handle);
      });
    });

    root.querySelectorAll(&#x27;[data-spacing-rhythm]&#x27;).forEach(cluster =&gt; {
      for (let row = 0; row &lt; 4; row++) {
        const line = document.createElement(&#x27;div&#x27;);
        line.className = &#x27;spacing-row&#x27;;
        for (let point = 0; point &lt; 6; point++) {
          const dot = document.createElement(&#x27;span&#x27;);
          dot.className = &#x27;spacing-point&#x27;;
          line.append(dot);
        }
        cluster.append(line);
      }
    });

    root.querySelectorAll(&#x27;[data-point-arcs]&#x27;).forEach(field =&gt; {
      [70, 98, 126, 154].forEach((radius, index) =&gt; {
        const samples = Math.ceil((radius * 2.3) / 7);
