<section
  id="hero"
  data-testid="section-hero"
  class="hero-section flex items-center justify-center md:py-0">
  <svg
    class="hero-contours"
    viewBox="0 0 1440 1000"
    preserveAspectRatio="none"
    aria-hidden="true"
    focusable="false"
    fill="none"
    stroke="currentColor"
    stroke-width="1"
    xmlns="http://www.w3.org/2000/svg">
    <path
      d="M-80 370 C260 140 410 650 760 360 S1220 110 1520 410"
      vector-effect="non-scaling-stroke" />
    <path
      d="M-80 460 C260 230 410 740 760 450 S1220 200 1520 500"
      vector-effect="non-scaling-stroke" />
    <path
      d="M-80 550 C260 320 410 830 760 540 S1220 290 1520 590"
      vector-effect="non-scaling-stroke" />
  </svg>
  <div class="hero-content mx-auto w-full max-w-5xl self-center px-6 py-12 text-center md:px-4">
    <div class="hero-avatar-wrapper flex flex-col items-center self-center">
      <div class="hero-avatar avatar">
        <div
          class="ring-primary/50 ring-offset-base-100 h-60 w-60 overflow-hidden rounded-full shadow-2xl ring-4 ring-offset-8 lg:h-72 lg:w-72">
          <img
            [ngSrc]="avatarImage"
            [alt]="('common.firstName' | transloco) + ' ' + ('common.lastName' | transloco)"
            width="384"
            height="464"
            class="h-full w-full object-cover"
            priority />
        </div>
      </div>

      @if (openToWork()) {
        <div class="mt-12 md:hidden">
          <app-badge
            data-testid="hero-badge-mobile"
            badgeSize="lg">
            {{ 'common.navbar.openToWork' | transloco }}
          </app-badge>
        </div>
      }

      <h1
        class="hero-name lg:text-8xl3 mt-16 flex flex-col items-center gap-3 text-6xl font-bold tracking-wide lg:gap-6">
        <span
          data-testid="hero-firstname"
          class="text-ocean-outline">
          {{ 'common.firstName' | transloco }}</span
        >
        <span
          data-testid="hero-lastname"
          class="text-ocean-outline"
          >{{ 'common.lastName' | transloco }}</span
        >
      </h1>
      <div
        class="hero-about mx-auto mt-3 flex min-h-48 max-w-3xl pb-5 md:min-h-40 lg:mt-16 lg:min-h-36 lg:px-16">
        <p
          data-testid="hero-description"
          class="text-xl leading-relaxed font-medium text-(--color-text-muted)">
          {{ 'portfolio.hero.description' | transloco }}
        </p>
      </div>
    </div>
  </div>
</section>
