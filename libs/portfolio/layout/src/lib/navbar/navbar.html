<nav
  appMeasureNavbarHeight
  data-testid="navbar"
  [class]="
    'navbar fixed inset-x-0 top-0 z-50 border-b transition-[box-shadow,border-color,backdrop-filter,background-color] duration-300 will-change-[box-shadow,border-color,backdrop-filter,background-color] ' +
    (isScrolled()
      ? 'bg-base-100/80 border-base-300 dark:shadow-primary/10 shadow-lg backdrop-blur-md dark:shadow-md'
      : 'border-transparent bg-transparent shadow-none')
  ">
  <div
    data-testid="navbar-container"
    [class.md:justify-between]="openToWork()"
    [class.md:justify-end]="!openToWork()"
    class="container mx-auto flex max-w-5xl flex-col items-center justify-center gap-6 px-2 py-4 md:flex-row md:gap-0 md:py-6">
    <!-- Repeats the hero heading once the hero is gone, so it is hidden from assistive technology. -->
    <span
      data-testid="navbar-name"
      class="navbar-name hidden text-xl md:mr-5 md:block"
      aria-hidden="true">
      <span class="font-medium">{{ 'common.firstName' | transloco }}</span>
      {{ 'common.lastName' | transloco }}
    </span>
    @if (openToWork()) {
      <app-badge
        class="hidden md:block"
        data-testid="hero-badge">
        {{ 'common.navbar.openToWork' | transloco }}
      </app-badge>
    }

    <div class="flex items-center gap-6 sm:gap-4 md:ml-auto md:gap-3">
      <button
        #cvButton
        data-testid="cv-download-btn"
        type="button"
        [attr.aria-disabled]="isDownloading()"
        [attr.aria-label]="
          isDownloading()
            ? ('common.navbar.downloadingCV' | transloco)
            : ('common.navbar.downloadCVLabel' | transloco)
        "
        [attr.aria-busy]="isDownloading()"
        (click)="handleDownloadCV(cvButton)"
        class="text-primary/90 dark:text-base-content/80 hover:text-primary hover:text-shadow-primary focus-visible:outline-primary flex items-center text-xl font-semibold transition-all duration-400 hover:scale-115 hover:cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-4 aria-disabled:cursor-not-allowed aria-disabled:opacity-50 sm:mr-1.5 md:text-lg">
        @if (isDownloading()) {
          <span
            class="loading loading-dots loading-sm text-primary"
            aria-hidden="true"></span>
        } @else {
          {{ 'common.navbar.downloadCV' | transloco }}
        }
      </button>

      <button
        type="button"
        [attr.aria-label]="'common.navbar.contactMe' | transloco"
        (click)="contactEmail()"
        class="text-primary/90 dark:text-base-content/70 hover:text-primary transition-all duration-400 hover:scale-115 hover:cursor-pointer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          class="hover:icon-shadow-primary-xs h-6 w-6 sm:h-[1.3rem] sm:w-[1.3rem]"
          stroke-linejoin="round">
          <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
          <rect
            x="2"
            y="4"
            width="20"
            height="16"
            rx="2" />
        </svg>
      </button>
      <app-language-switcher />
    </div>
  </div>
</nav>
