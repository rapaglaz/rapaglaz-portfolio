<section
  id="hero"
  data-testid="section-hero"
  class="hero-section flex items-center justify-center md:py-0">
  <div
    class="hero-content mx-auto w-full max-w-5xl self-center px-6 py-6 text-center md:px-4 md:py-12">
    <div class="hero-avatar-wrapper flex flex-col items-center self-center">
      <div class="hero-avatar avatar">
        <div
          class="ring-primary/50 ring-offset-base-100 h-60 w-60 overflow-hidden rounded-full shadow-[0_0_48px_color-mix(in_srgb,var(--color-primary)_35%,transparent)] ring-4 ring-offset-8 lg:h-72 lg:w-72">
          <img
            [ngSrc]="avatarImage"
            [alt]="('common.firstName' | transloco) + ' ' + ('common.lastName' | transloco)"
            width="384"
            height="464"
            class="h-full w-full object-cover"
            priority />
        </div>
      </div>

      @if (openToWork()) {
        <div class="mt-12 md:hidden">
          <app-badge
            data-testid="hero-badge-mobile"
            badgeSize="lg">
            {{ 'common.navbar.openToWork' | transloco }}
          </app-badge>
        </div>
      }

      <h1
        class="hero-name mt-12 flex flex-col items-center text-6xl md:flex-row md:justify-center md:gap-5 lg:text-7xl">
        <span
          data-testid="hero-firstname"
          class="font-medium"
          >{{ 'common.firstName' | transloco }}</span
        >
        <span data-testid="hero-lastname">{{ 'common.lastName' | transloco }}</span>
      </h1>
      <div class="hero-about mx-auto mt-6 max-w-3xl pb-5 lg:px-16">
        <p
          data-testid="hero-description"
          class="text-xl leading-relaxed font-medium text-(--color-text-muted)">
          {{ 'portfolio.hero.description' | transloco }}
        </p>
      </div>
    </div>
  </div>
</section>
