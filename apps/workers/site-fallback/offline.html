<!doctype html>
<!--
  Offline page of the portfolio. The Worker fills the double-bracket tokens with the texts of index.ts.
  Everything is inline and there is no script: the page must work while the web host is down.
  The colors and the outlined heading come from apps/rapaglaz-portfolio/src/styles.css.
-->
<html lang="[[lang]]">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="color-scheme"
      content="light dark" />
    <meta
      name="robots"
      content="noindex" />
    <!-- when the origin is back, the reload shows the real page at the same address -->
    <meta
      http-equiv="refresh"
      content="60" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap"
      rel="stylesheet" />
    <title>[[title]]</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #143033;
        --muted: #4a6366;
        --primary: #4e696b;
        --outline: rgb(89 162 173 / 0.3);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #080c0e;
          --text: #f9fafb;
          --muted: #a8b5b7;
          --primary: #86e3eb;
          --outline: #59a2add2;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        max-width: 30rem;
        text-align: center;
        animation: fade-in-up 0.5s ease-out both;
      }

      /* the outlined heading of the hero name */
      h1 {
        margin: 0 0 20px;
        font-size: clamp(1.75rem, 7vw, 2.5rem);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0.075em;
        color: var(--text);
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        text-shadow:
          -1px -1px 0 var(--outline),
          1px -1px 0 var(--outline),
          -1px 1px 0 var(--outline),
          1px 1px 0 var(--outline),
          0 -1px 0 var(--outline),
          0 1px 0 var(--outline),
          -1px 0 0 var(--outline),
          1px 0 0 var(--outline);
      }

      .message {
        margin: 0 0 36px;
        font-size: 1.125rem;
        font-weight: 500;
        color: var(--muted);
      }

      .button {
        display: inline-block;
        padding: 8px 24px;
        font-weight: 600;
        color: var(--primary);
        text-decoration: none;
        border: 1px solid var(--primary);
        border-radius: 0.5rem;
        transition:
          background-color 0.25s,
          color 0.25s;
      }

      .button:hover {
        color: var(--bg);
        background: var(--primary);
      }

      .button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }

      .hint {
        margin: 24px 0 0;
        font-size: 0.875rem;
        color: var(--muted);
        opacity: 0.8;
      }

      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* same rule as in the portfolio: no motion when the visitor asks for none */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>[[heading]]</h1>
      <p class="message">[[message]]</p>
      <a
        class="button"
        href=""
        >[[reload]]</a
      >
    </main>
  </body>
</html>
